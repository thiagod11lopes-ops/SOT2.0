<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Estoque" />
    <link rel="apple-touch-icon" href="./alianca-ebenezer-logo.png" />
    <meta name="theme-color" content="#07080c" />
    <meta
      name="description"
      content="Controle de Material em endereço próprio. Estoque separado do ícone no sistema principal."
    />
    <title>Controle de Material</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var target = "#/controle-material";
        if (window.location.hash === target || window.location.hash.indexOf(target + "/") === 0) return;
        try {
          if (window.history.replaceState) {
            window.history.replaceState(
              null,
              "",
              window.location.pathname + window.location.search + target,
            );
          } else {
            window.location.replace(window.location.pathname + window.location.search + target);
          }
        } catch (e) {
          window.location.hash = target;
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("sot-appearance");
          if (!raw) return;
          var mode = raw;
          if (raw.charAt(0) === "{") {
            var parsed = JSON.parse(raw);
            mode = parsed && parsed.mode;
          }
          if (mode && mode !== "original") {
            document.documentElement.dataset.appearance = mode;
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      html, body { margin: 0; background: #05060a; }
      .ebenezer-boot {
        position: fixed;
        inset: 0;
        z-index: 4000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.35rem;
        background:
          radial-gradient(ellipse 55% 42% at 50% 42%, rgba(214, 222, 232, 0.16), transparent 68%),
          radial-gradient(circle at 50% 120%, rgba(80, 90, 110, 0.35), transparent 45%),
          #05060a;
        color: #e8edf4;
        overflow: hidden;
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      .ebenezer-boot--out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .ebenezer-boot__glow {
        position: absolute;
        width: min(78vw, 420px);
        height: min(78vw, 420px);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.14), transparent 62%);
        filter: blur(8px);
        animation: ebenezer-glow 3.2s ease-in-out infinite;
      }
      .ebenezer-boot__stage {
        position: relative;
        width: min(72vw, 300px);
        height: min(72vw, 300px);
        display: grid;
        place-items: center;
      }
      .ebenezer-boot__mark {
        width: 88%;
        height: 88%;
        object-fit: contain;
        object-position: center;
        filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
        animation: ebenezer-float 3.6s ease-in-out infinite;
      }
      .ebenezer-boot__sheen {
        position: absolute;
        width: 88%;
        height: 88%;
        overflow: hidden;
        pointer-events: none;
        border-radius: 50%;
      }
      .ebenezer-boot__sheen::after {
        content: "";
        position: absolute;
        inset: -20%;
        background: linear-gradient(115deg, transparent 36%, rgba(255, 255, 255, 0.42) 48%, transparent 60%);
        transform: translateX(-120%);
        animation: ebenezer-sheen 2.8s ease-in-out infinite;
      }
      .ebenezer-boot__ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
      }
      .ebenezer-boot__ring--outer {
        inset: 0;
        background:
          conic-gradient(from 0deg, transparent 0 72%, rgba(232, 237, 244, 0.95) 86%, transparent 100%) border-box;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        padding: 2px;
        animation: ebenezer-spin 2.4s linear infinite;
        filter: drop-shadow(0 0 8px rgba(220, 228, 240, 0.45));
      }
      .ebenezer-boot__ring--inner {
        inset: 8%;
        border: 1px dashed rgba(210, 218, 230, 0.35);
        animation: ebenezer-spin 7s linear infinite reverse;
      }
      .ebenezer-boot__orbit {
        position: absolute;
        inset: -4%;
        animation: ebenezer-spin 3.4s linear infinite;
      }
      .ebenezer-boot__orbit::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: #f4f7fb;
        box-shadow: 0 0 16px 4px rgba(230, 236, 245, 0.85);
      }
      .ebenezer-boot__verse {
        position: relative;
        margin: -0.35rem 0 0;
        max-width: min(84vw, 340px);
        padding: 0 1.25rem;
        text-align: center;
        animation: ebenezer-verse 0.9s ease both;
      }
      .ebenezer-boot__verse-text {
        margin: 0;
        font-family: "Plus Jakarta Sans", Inter, sans-serif;
        font-size: clamp(0.95rem, 3.4vw, 1.08rem);
        font-weight: 500;
        font-style: italic;
        line-height: 1.45;
        color: rgba(244, 247, 251, 0.95);
      }
      .ebenezer-boot__verse-ref {
        margin: 0.7rem 0 0;
        font-family: Inter, sans-serif;
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-indent: 0.26em;
        text-transform: uppercase;
        color: rgba(196, 204, 216, 0.72);
      }
      .ebenezer-boot__verse-ref::before {
        content: "";
        display: block;
        width: 2.4rem;
        height: 1px;
        margin: 0 auto 0.65rem;
        background: linear-gradient(90deg, transparent, rgba(236, 241, 248, 0.75), transparent);
      }
      @keyframes ebenezer-spin { to { transform: rotate(360deg); } }
      @keyframes ebenezer-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes ebenezer-glow {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes ebenezer-sheen {
        0%, 42% { transform: translateX(-120%); }
        100% { transform: translateX(120%); }
      }
      @keyframes ebenezer-verse {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ebenezer-boot__glow,
        .ebenezer-boot__mark,
        .ebenezer-boot__ring--outer,
        .ebenezer-boot__ring--inner,
        .ebenezer-boot__orbit,
        .ebenezer-boot__sheen::after,
        .ebenezer-boot__verse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="ebenezer-boot" class="ebenezer-boot" role="status" aria-live="polite" aria-label="Mas faça-se tudo decentemente e com ordem. 1 Coríntios 14:40">
      <div class="ebenezer-boot__glow" aria-hidden="true"></div>
      <div class="ebenezer-boot__stage">
        <div class="ebenezer-boot__ring ebenezer-boot__ring--outer" aria-hidden="true"></div>
        <div class="ebenezer-boot__ring ebenezer-boot__ring--inner" aria-hidden="true"></div>
        <div class="ebenezer-boot__orbit" aria-hidden="true"></div>
        <img class="ebenezer-boot__mark" src="./alianca-ebenezer-logo.png?v=1" alt="" />
        <div class="ebenezer-boot__sheen" aria-hidden="true"></div>
      </div>
      <blockquote class="ebenezer-boot__verse">
        <p class="ebenezer-boot__verse-text">“Mas faça-se tudo decentemente e com ordem.”</p>
        <p class="ebenezer-boot__verse-ref">1 Coríntios 14:40</p>
      </blockquote>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
